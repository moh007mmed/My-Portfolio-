<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){var l=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar';document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';})();</script>
<title>الجانب البرّي | محمد محمود الريح</title>
<meta name="description" content="محمد محمود الريح — الجانب الآخر: شغف بالبرية والأسود، بعيدًا عن الشاشات والكود.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23000'/%3E%3Ctext x='50' y='69' font-family='Arial' font-size='56' font-weight='700' fill='%23F2B84B' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Cairo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --ink:#030303; --ink-soft:#0a0908;
  --sand:#EDE6D6; --sand-dim:#A79E8C;
  --gold:#F2B84B; --gold-line:rgba(242,184,75,.28);
  --ember:#D97706;
  --font-display:'Space Grotesk','Cairo',sans-serif;
  --font-body:'Inter','Cairo',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--sand);font-family:var(--font-body);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,svg,video{display:block;max-width:100%}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
[dir="rtl"] .flip-rtl{transform:scaleX(-1)}
::selection{background:var(--gold);color:#1a1204}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.container{max-width:900px;margin-inline:auto;padding-inline:24px}

/* topbar */
.topbar{position:fixed;inset-inline:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:22px 24px}
.back-link{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12.5px;color:var(--sand);opacity:.85;transition:.2s}
.back-link:hover{opacity:1;color:var(--gold)}
.back-link svg{width:15px;height:15px}
.lang-btn{font-family:var(--font-mono);font-size:12px;border:1px solid rgba(237,230,214,.25);border-radius:999px;padding:7px 13px;color:var(--sand);transition:.2s}
.lang-btn:hover{border-color:var(--gold-line);color:var(--gold)}

/* hero */
.hero-wild{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:saturate(1.05) contrast(1.05)}
.overlay{position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(180deg, rgba(3,3,3,.55) 0%, rgba(3,3,3,.3) 32%, rgba(3,3,3,.8) 80%, #030303 100%),
    radial-gradient(ellipse 70% 60% at 50% 38%, transparent 35%, rgba(3,3,3,.55) 100%);
}
.embers{position:absolute;inset:0;z-index:2;pointer-events:none}
.ember{position:absolute;bottom:-10px;border-radius:50%;background:radial-gradient(circle,#F2B84B,#D97706 60%,transparent 72%);box-shadow:0 0 6px 1px rgba(242,184,75,.55);animation:emberRise linear infinite}
@keyframes emberRise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.85}80%{opacity:.4}100%{transform:translateY(-380px) translateX(var(--drift,15px));opacity:0}}

.hero-content{position:relative;z-index:3;text-align:center;padding:0 24px;max-width:720px}
.eyebrow{
  font-family:var(--font-mono);font-size:12.5px;letter-spacing:.1em;color:var(--gold);
  display:inline-flex;align-items:center;gap:10px;margin-bottom:22px;opacity:0;animation:fadeUp .8s var(--ease) .1s forwards;
}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--gold-line)}
.hero-name{
  font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;line-height:1.08;
  font-size:clamp(36px,7.5vw,80px);color:var(--sand);text-shadow:0 4px 30px rgba(0,0,0,.55);
  opacity:0;animation:fadeUp .9s var(--ease) .25s forwards;
}
.hero-sub{
  margin-top:20px;font-size:clamp(15px,2vw,18.5px);color:var(--sand-dim);max-width:480px;margin-inline:auto;
  opacity:0;animation:fadeUp .9s var(--ease) .42s forwards;
}
.scroll-cue{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:3;
  width:24px;height:24px;color:var(--gold);opacity:0;
  animation:fadeUp .9s var(--ease) .7s forwards, bounce 2.2s ease-in-out 1.5s infinite;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* manifesto */
.manifesto{padding:100px 0 64px;text-align:center}
.manifesto p{font-size:clamp(17px,2.2vw,21px);color:var(--sand);max-width:600px;margin-inline:auto;margin-bottom:20px}
.manifesto p:last-child{color:var(--gold);font-family:var(--font-display);font-weight:600;font-size:clamp(16px,2vw,19px);margin-bottom:0}

/* traits */
.traits{padding:20px 0 110px}
.trait-grid{display:grid;gap:16px;grid-template-columns:1fr}
.trait-card{
  border:1px solid rgba(237,230,214,.12);border-radius:16px;padding:32px 26px;text-align:center;
  background:linear-gradient(180deg, rgba(242,184,75,.04), transparent);transition:.3s var(--ease);
}
.trait-card:hover{border-color:var(--gold-line);transform:translateY(-4px)}
.trait-icon{width:42px;height:42px;margin-inline:auto;margin-bottom:18px;color:var(--gold);opacity:.9}
.trait-card h3{font-family:var(--font-display);font-size:19px;color:var(--sand);margin-bottom:10px}
.trait-card p{font-size:14px;color:var(--sand-dim);line-height:1.65}
@media(min-width:760px){.trait-grid{grid-template-columns:repeat(3,1fr)}}

[data-reveal]{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
[data-reveal].in{opacity:1;transform:translateY(0)}

/* footer */
.footer-wild{border-top:1px solid rgba(237,230,214,.1);padding:36px 24px;text-align:center}
.footer-wild .sig{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--sand);margin-bottom:6px}
.footer-wild .note{font-family:var(--font-mono);font-size:11.5px;color:var(--sand-dim);letter-spacing:.03em}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .hero-name,.hero-sub,.eyebrow,.scroll-cue{opacity:1}
  .embers{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-link" id="backLink">
    <svg class="flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span data-i18n="back"></span>
  </a>
  <button class="lang-btn" id="langBtn">EN</button>
</div>

<section class="hero-wild">
  <video class="bg-video" autoplay muted loop playsinline aria-hidden="true"
    poster="https://assets.mixkit.co/videos/11035/11035-thumb-720-0.jpg">
    <source src="https://assets.mixkit.co/videos/11035/11035-720.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>
  <div class="embers" id="embers"></div>
  <div class="hero-content">
    <span class="eyebrow" data-i18n="eyebrow"></span>
    <h1 class="hero-name" data-i18n="name"></h1>
    <p class="hero-sub" data-i18n="sub"></p>
  </div>
  <svg class="scroll-cue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v16M6 14l6 6 6-6"/></svg>
</section>

<section class="manifesto container" data-reveal>
  <p data-i18n="m1"></p>
  <p data-i18n="m2"></p>
</section>

<section class="traits container" data-reveal>
  <div class="trait-grid">
    <div class="trait-card">
      <svg class="trait-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z"/></svg>
      <h3 data-i18n="t1_t"></h3>
      <p data-i18n="t1_b"></p>
    </div>
    <div class="trait-card">
      <svg class="trait-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2M3 14c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2M3 20c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2"/></svg>
      <h3 data-i18n="t2_t"></h3>
      <p data-i18n="t2_b"></p>
    </div>
    <div class="trait-card">
      <svg class="trait-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <h3 data-i18n="t3_t"></h3>
      <p data-i18n="t3_b"></p>
    </div>
  </div>
</section>

<footer class="footer-wild">
  <div class="sig" data-i18n="name"></div>
  <div class="note" data-i18n="footer_note"></div>
</footer>

<script>
const i18n = {
  ar:{
    title:"الجانب البرّي | محمد محمود الريح",
    desc:"محمد محمود الريح — الجانب الآخر: شغف بالبرية والأسود، بعيدًا عن الشاشات والكود.",
    back:"البورتفوليو",
    eyebrow:"الجانب البرّي",
    name:"محمد محمود الريح",
    sub:"مطوّر بالنهار، وقلبه يهيم في البرية حين يصمت كل شيء.",
    m1:"بعيدًا عن الشاشات والأكواد، هناك جانب آخر مني — ينجذب إلى صمت البرية، وهيبة الأسد، وحرية لا تُقاس بالبكسل. ليست هواية عابرة، بل جزء أصيل من هويتي.",
    m2:"هذا الجانب لا علاقة له بالعمل. إنه أنا، فقط.",
    t1_t:"القوة", t1_b:"ليست القوة في الصوت العالي، بل في الثبات وسط العاصفة.",
    t2_t:"الحرية", t2_b:"البرية لا تعرف قيودًا، وأنا أحتاج تلك المساحة لأتنفس.",
    t3_t:"الفخر", t3_b:"أن تكون على طبيعتك دون اعتذار — هذا أعمق معاني الملكية.",
    footer_note:"صفحة شخصية بحتة — لا علاقة لها بالعمل",
  },
  en:{
    title:"The Wild Side | Mohammed Mahmoud Alryah",
    desc:"Mohammed Mahmoud Alryah — the other side: a passion for the wild and lions, far from screens and code.",
    back:"Portfolio",
    eyebrow:"The Wild Side",
    name:"Mohammed Mahmoud Alryah",
    sub:"A developer by day. When everything else goes quiet, his heart still runs wild.",
    m1:"Away from the screens and the code, there's another side of me — drawn to the silence of the wild, the majesty of the lion, and a freedom that can't be measured in pixels. It's not a passing hobby. It's a real part of who I am.",
    m2:"This side has nothing to do with work. It's just me.",
    t1_t:"Strength", t1_b:"Strength isn't in a loud roar — it's in standing still through the storm.",
    t2_t:"Freedom", t2_b:"The wild knows no limits, and I need that space to breathe.",
    t3_t:"Pride", t3_b:"Being exactly who you are, without apology — that's the deepest meaning of a king.",
    footer_note:"A purely personal page — unrelated to work",
  }
};

function currentLang(){ return new URLSearchParams(location.search).get('lang')==='en' ? 'en' : 'ar'; }

function applyLang(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  const dict = i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(dict[k]!==undefined) el.textContent = dict[k];
  });
  document.title = dict.title;
  const metaDesc = document.querySelector('meta[name="description"]');
  if(metaDesc) metaDesc.setAttribute('content', dict.desc);
  document.getElementById('langBtn').textContent = lang==='ar' ? 'EN' : 'ع';
  document.getElementById('backLink').setAttribute('href', lang==='en' ? 'index.html?lang=en' : 'index.html');
  history.replaceState(null,'', lang==='en' ? (location.pathname+'?lang=en') : location.pathname);
}

document.getElementById('langBtn').addEventListener('click', ()=>{
  applyLang(currentLang()==='ar' ? 'en' : 'ar');
});

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduceMotion){
  const container = document.getElementById('embers');
  for(let i=0;i<16;i++){
    const e = document.createElement('span');
    e.className = 'ember';
    const size = (2 + Math.random()*3).toFixed(1);
    e.style.left = (Math.random()*100).toFixed(1)+'%';
    e.style.width = size+'px';
    e.style.height = size+'px';
    e.style.animationDuration = (6+Math.random()*7).toFixed(1)+'s';
    e.style.animationDelay = (Math.random()*9).toFixed(1)+'s';
    e.style.setProperty('--drift', (Math.random()*44-22).toFixed(0)+'px');
    container.appendChild(e);
  }
} else {
  const v = document.querySelector('.bg-video');
  if(v){ v.removeAttribute('autoplay'); v.pause(); }
}

const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{threshold:.12});
document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));

applyLang(currentLang());
</script>
</body>
</html>
